version: '3.8'

services:
  pipeline_simulator:
    build:
      context: ./pipeline_simulator
    container_name: aquapulse_simulator
    ports:
      - "8001:8001"
    environment:
      - PORT=8001
    restart: always

  aia_service:
    build:
      context: ./aia_service
    container_name: aquapulse_aia
    ports:
      - "8000:8000"
    environment:
      - PORT=8000
      - SIMULATOR_URL=http://pipeline_simulator:8001
    depends_on:
      - pipeline_simulator
    restart: always

  hmi_scada:
    build:
      context: ./hmi_scada
    container_name: aquapulse_hmi
    ports:
      - "8501:8501"
    environment:
      - SIMULATOR_URL=http://pipeline_simulator:8001
      - AIA_URL=http://aia_service:8000
    depends_on:
      - pipeline_simulator
      - aia_service
    restart: always
