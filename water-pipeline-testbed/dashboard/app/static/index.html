<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>AquaPulse Testbed — Scenario Control Panel</title>
<link rel="stylesheet" href="/static/style.css" />
</head>
<body>
  <header>
    <h1>AquaPulse Water Pipeline Testbed</h1>
    <div id="global-status">
      <span id="conn-dot" class="dot dot-red"></span>
      <span id="conn-label">connecting…</span>
      <span id="tick-label">tick 0</span>
      <span id="temp-label">env 38.0°C</span>
    </div>
  </header>

  <main>
    <section id="pipeline-view">
      <h2>Pipeline</h2>
      <svg id="pipeline-svg" viewBox="0 0 900 420" xmlns="http://www.w3.org/2000/svg"></svg>
      <div class="legend">
        <span><i class="dot dot-green"></i> Normal</span>
        <span><i class="dot dot-yellow"></i> Tier 1</span>
        <span><i class="dot dot-orange"></i> Tier 2</span>
        <span><i class="dot dot-red"></i> Tier 3</span>
        <span><i class="dot dot-gray"></i> Instrument fault</span>
        <span><i class="dot dot-blue"></i> Connectivity artifact</span>
      </div>
    </section>

    <section id="readouts">
      <h2>Live Sensor Readouts</h2>
      <table id="readout-table">
        <thead>
          <tr><th>Cluster</th><th>Pressure (psi)</th><th>Flow (lps)</th><th>Temp (°C)</th><th>Active Fault</th></tr>
        </thead>
        <tbody></tbody>
      </table>
    </section>

    <section id="control-panel">
      <h2>Scenario Control Panel</h2>

      <div class="control-row">
        <button id="btn-start">▶ Start</button>
        <button id="btn-stop">⏸ Stop</button>
        <button id="btn-reset">⟲ Reset</button>
        <button id="btn-clear-all">✕ Clear All Faults</button>
      </div>

      <div class="control-row">
        <label>Environment Temperature</label>
        <button data-temp="normal">Normal (38°C)</button>
        <button data-temp="high">High (47°C)</button>
        <button data-temp="extreme">Extreme (53°C)</button>
      </div>

      <div class="control-row" id="inject-form">
        <label>Cluster
          <select id="sel-cluster"></select>
        </label>
        <label>Fault Type
          <select id="sel-fault-type"></select>
        </label>
        <label>Magnitude
          <select id="sel-magnitude"></select>
        </label>
        <button id="btn-inject">Inject Fault</button>
      </div>

      <div class="control-row">
        <label>Nokia NaC Platform (CAMARA API)</label>
        <button id="btn-outage-on">Simulate Outage</button>
        <button id="btn-outage-off">Clear Outage</button>
      </div>

      <div id="inject-feedback"></div>
    </section>

    <section id="investigation-feed">
      <h2>Anomaly Investigation Feed</h2>
      <div id="feed-list"></div>
    </section>
  </main>

  <script src="/static/app.js"></script>
</body>
</html>
